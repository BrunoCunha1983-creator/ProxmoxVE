name: Build AION Server OS Live ISO
on:
  push:
    branches: [aion-os-live]
    paths: ['aion-os-live-src/**','.github/workflows/build-aion-live.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build AION Live in Debian 13
        run: |
          mkdir -p dist
          docker run --rm --privileged -v "$GITHUB_WORKSPACE:/work" debian:trixie bash -lc 'set -eux; apt-get update; DEBIAN_FRONTEND=noninteractive apt-get install -y live-build debootstrap xorriso squashfs-tools curl ca-certificates gnupg file; chmod +x /work/aion-os-live-src/build-aion-live.sh; /work/aion-os-live-src/build-aion-live.sh'
      - name: Validate boot image
        run: |
          test -s dist/aion-server-os-live-0.1-amd64.iso
          sha256sum -c dist/aion-server-os-live-0.1-amd64.iso.sha256
          file dist/aion-server-os-live-0.1-amd64.iso
          docker run --rm -v "$GITHUB_WORKSPACE:/work" debian:trixie bash -lc 'apt-get update >/dev/null; apt-get install -y xorriso >/dev/null; xorriso -indev /work/dist/aion-server-os-live-0.1-amd64.iso -report_el_torito plain'
      - name: Metadata
        run: printf 'AION Server OS Live 0.1\nCommit: %s\nBuilt: %s\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > dist/BUILD-INFO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: aion-server-os-live-amd64
          path: dist/
          compression-level: 0
          retention-days: 30
