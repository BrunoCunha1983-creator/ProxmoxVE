<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AION Server OS</title><style>
:root{font-family:system-ui;background:#101317;color:#e8edf2}body{margin:0}.top{height:54px;background:#171c22;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid #303944}.brand{font-size:22px;font-weight:700}.tag{margin-left:12px;color:#8fa3b8}.wrap{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 55px)}nav{background:#151a20;padding:16px}.nav{padding:10px;border-radius:6px;margin-bottom:6px;cursor:pointer}.nav:hover,.on{background:#26303a}.main{padding:20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#171d24;border:1px solid #303944;border-radius:9px;padding:14px}.big{font-size:24px;font-weight:700;margin-top:6px}table{width:100%;border-collapse:collapse;margin-top:14px;background:#171d24;border:1px solid #303944}th,td{text-align:left;padding:9px;border-bottom:1px solid #303944}button{background:#2d6cdf;color:white;border:0;border-radius:5px;padding:7px 10px;margin-right:5px;cursor:pointer}.danger{background:#9b3b45}.muted{color:#91a0af}pre{white-space:pre-wrap}.ok{color:#7bd88f}.bad{color:#ff6b78}@media(max-width:700px){.wrap{grid-template-columns:1fr}nav{display:none}}
</style></head><body><div class="top"><div class="brand">AION Server OS</div><div class="tag">Autonomous Proxmox-based infrastructure</div></div><div class="wrap"><nav><div class="nav on">Dashboard</div><div class="nav">Virtual Machines</div><div class="nav">Containers</div><div class="nav">Storage</div><div class="nav">Network</div><div class="nav">Autonomy / AI</div><div class="nav">Maintenance</div></nav><main class="main"><h2>Infrastructure</h2><div id="cards" class="cards"></div><h3>VMs & Containers</h3><table><thead><tr><th>ID</th><th>Name</th><th>Type</th><th>Status</th><th>Node</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table><h3>Autonomous maintenance</h3><div class="card"><pre id="maint">Loading…</pre></div></main></div><script>
const api=async(u,o)=>{let r=await fetch(u,o);if(!r.ok)throw new Error(await r.text());return r.json()};
async function load(){let s=await api('/api/system'),i=await api('/api/inventory'),h=await api('/api/health'),m=await api('/api/maintenance');let rr=i.resources||[];document.getElementById('cards').innerHTML=`<div class=card>Host<div class=big>${s.hostname}</div><div class=muted>${s.edition} ${s.version}</div></div><div class=card>Workloads<div class=big>${rr.length}</div><div class=muted>VM + LXC</div></div><div class=card>Autonomy<div class="big ok">ACTIVE</div><div class=muted>Deep review every 48 h</div></div><div class=card>PVE Cluster<div class="big ${h.pve_cluster.ok?'ok':'bad'}">${h.pve_cluster.stdout.trim()||'unknown'}</div></div>`;document.getElementById('rows').innerHTML=rr.map(x=>{let k=x.type==='qemu'?'vm':'ct';return `<tr><td>${x.vmid}</td><td>${x.name||''}</td><td>${x.type}</td><td>${x.status}</td><td>${x.node||''}</td><td><button onclick="act('${k}',${x.vmid},'start')">Start</button><button onclick="act('${k}',${x.vmid},'reboot')">Reboot</button><button class=danger onclick="act('${k}',${x.vmid},'shutdown')">Shutdown</button></td></tr>`}).join('');document.getElementById('maint').textContent=JSON.stringify(m,null,2)}
async function act(k,id,a){if(!confirm(`${a} ${k} ${id}?`))return;await api(`/api/action/${k}/${id}/${a}`,{method:'POST'});setTimeout(load,1000)}load().catch(e=>document.body.insertAdjacentHTML('beforeend',`<pre>${e}</pre>`));
</script></body></html>
